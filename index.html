<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>말해봐 · 3차 MVP</title>
<style>
:root{
  --ink:#171512;
  --paper:#FBF9F4;
  --line:#E4DED2;
  --muted:#8A8272;
  --signal:#C4442E;
  --ok:#3E7C5A;
  --card:#FFFFFF;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:"Pretendard","Malgun Gothic",-apple-system,sans-serif;
  background:var(--paper);
  color:var(--ink);
  min-height:100vh;
}
.wrap{max-width:640px;margin:0 auto;padding:32px 20px 60px;}
header{display:flex;align-items:baseline;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:14px;}
.logo{font-size:30px;font-weight:800;}
.badge{font-size:11px;font-weight:700;color:#fff;background:var(--signal);padding:3px 8px;border-radius:3px;}
.tag{margin-left:auto;font-size:12px;color:var(--muted);}
.qlabel{margin:26px 0 12px;font-size:12px;font-weight:700;color:var(--muted);}
.question{font-size:26px;font-weight:700;line-height:1.4;}
.qcount{margin-top:10px;font-size:13px;color:var(--muted);}
.target-row{margin-top:14px;font-size:14px;color:var(--muted);}
.target-row b{color:var(--ink);}
.gauge{position:relative;height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin:16px 0 6px;}
.band{position:absolute;top:0;bottom:0;background:#D9E7DF;}
.now{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--ink);}
.gauge.over .now{background:var(--signal);}
.gauge-lab{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);}
.mic-row{display:flex;align-items:center;gap:12px;margin-top:24px;}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line);}
.dot.live{background:var(--signal);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.mic-status{font-size:14px;color:var(--muted);}
.meter{margin-top:14px;height:8px;background:var(--line);border-radius:5px;overflow:hidden;}
.meter-fill{width:0;height:100%;background:var(--ink);}
.timer{margin-top:24px;font-size:80px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;}
.timer small{font-size:24px;color:var(--muted);}
.hint{margin-top:8px;min-height:20px;font-size:14px;color:var(--muted);}
.controls{display:flex;gap:12px;margin-top:26px;}
button{border:none;border-radius:6px;padding:17px 20px;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;}
button:disabled{opacity:.4;cursor:not-allowed;}
.btn-main{flex:1;background:var(--ink);color:#fff;}
.btn-next{background:#fff;color:var(--ink);border:1px solid var(--line);}
.result{display:none;margin-top:26px;padding:20px;background:#fff;border:1px solid var(--line);border-radius:10px;}
.result.show{display:block;}
.result h3{margin-bottom:14px;font-size:12px;color:var(--muted);}
table{width:100%;border-collapse:collapse;}
th,td{padding:9px 6px;border-bottom:1px solid var(--line);font-size:13px;text-align:right;}
th:first-child,td:first-child{text-align:left;}
tr.latest td{font-weight:800;}
.verdict{margin-top:16px;font-size:14px;line-height:1.6;}
.warn{color:var(--signal);}
.landed{color:var(--ok);font-weight:700;}
.flag{display:inline-block;margin-left:5px;padding:2px 6px;font-size:11px;border-radius:3px;background:#F3E6E1;color:var(--signal);}
.flag.ok{background:#E4EFE9;color:var(--ok);}

/* 한줄평 */
#feedbackBox{display:none;margin-top:30px;padding:22px;background:#fff;border:1px solid var(--line);border-radius:10px;}
#feedbackBox h3{margin-bottom:8px;font-size:20px;}
.feedback-desc{margin-bottom:14px;font-size:13px;color:var(--muted);line-height:1.6;}
#feedbackInput{width:100%;height:90px;padding:12px;resize:vertical;font-family:inherit;font-size:14px;border:1px solid var(--line);border-radius:6px;}
.feedback-buttons{display:flex;gap:10px;margin-top:12px;}
.feedback-buttons button{flex:1;}
#feedbackDone{display:none;color:var(--ok);font-weight:700;}
footer{padding-top:26px;text-align:center;font-size:11px;color:var(--muted);}
</style>
</head>

<body>
<div class="wrap">

  <header>
    <span class="logo">말해봐</span>
    <span class="badge">3차 MVP</span>
    <span class="tag" id="tag">목표시간 · 안착 판정</span>
  </header>

  <div class="qlabel">예상 질문</div>
  <div class="question" id="question">자기소개 부탁드립니다.</div>
  <div class="qcount" id="qcount">질문 1 / 20</div>

  <div class="target-row">
    목표 <b id="targetTxt">60초</b> · 허용 ±10초
  </div>

  <div class="gauge" id="gauge">
    <div class="band" id="band"></div>
    <div class="now" id="now"></div>
  </div>

  <div class="gauge-lab">
    <span>0초</span>
    <span id="gaugeMax">120초</span>
  </div>

  <div class="mic-row">
    <span class="dot" id="dot"></span>
    <span class="mic-status" id="micStatus">마이크 준비 안 됨</span>
  </div>

  <div class="meter">
    <div class="meter-fill" id="meter"></div>
  </div>

  <div class="timer" id="timer">0<small>.0초</small></div>
  <div class="hint" id="hint">준비되면 답변 시작을 누르세요.</div>

  <div class="controls">
    <button class="btn-main" id="mainBtn">답변 시작</button>
    <button class="btn-next" id="nextBtn">다음 질문</button>
  </div>

  <div class="result" id="result">
    <h3>회차별 기록</h3>
    <table>
      <thead>
        <tr>
          <th>회차</th>
          <th>시간</th>
          <th>목표</th>
          <th>어절</th>
          <th>속도</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="verdict" id="verdict"></div>
  </div>

  <!-- 마지막 질문에서만 표시 -->
  <div id="feedbackBox">
    <h3>한줄평</h3>
    <div class="feedback-desc">
      테스트가 끝났습니다 👏<br>
      사용해 본 느낌을 한줄로 남겨주세요.<br>
      한줄평은 선택사항입니다.
    </div>
    <textarea id="feedbackInput" maxlength="200"
      placeholder="예: 목표시간이 있어서 답변 길이를 조절하기 쉬웠어요."></textarea>
    <div class="feedback-buttons">
      <button class="btn-main" id="feedbackSubmitBtn" onclick="submitFeedback()">한줄평 제출</button>
      <button class="btn-next" id="feedbackSkipBtn" onclick="skipFeedback()">건너뛰기</button>
    </div>
    <div id="feedbackDone">감사합니다! 테스트가 완료되었습니다.</div>
  </div>

  <footer>
    마이크 음성은 기기에서 처리되며 원본 음성은 저장하지 않습니다.
  </footer>

</div>
