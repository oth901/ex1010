<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>말해봐 · 3차 MVP</title>

<style>
:root{
  --ink:#171512;
  --paper:#FBF9F4;
  --line:#E4DED2;
  --muted:#8A8272;
  --signal:#C4442E;
  --ok:#3E7C5A;
  --card:#FFFFFF;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:"Pretendard","Malgun Gothic",-apple-system,sans-serif;
  background:var(--paper);
  color:var(--ink);
  min-height:100vh;
}

.wrap{
  max-width:640px;
  margin:0 auto;
  padding:32px 20px 60px;
}

header{
  display:flex;
  align-items:baseline;
  gap:12px;
  border-bottom:2px solid var(--ink);
  padding-bottom:14px;
}

.logo{
  font-size:30px;
  font-weight:800;
}

.badge{
  font-size:11px;
  font-weight:700;
  color:white;
  background:var(--signal);
  padding:3px 8px;
  border-radius:3px;
}

.tag{
  margin-left:auto;
  font-size:12px;
  color:var(--muted);
}

.qlabel{
  margin:26px 0 12px;
  font-size:12px;
  font-weight:700;
  color:var(--muted);
}

.question{
  font-size:26px;
  font-weight:700;
  line-height:1.4;
}

.qcount{
  margin-top:10px;
  font-size:13px;
  color:var(--muted);
}

.target-row{
  margin-top:14px;
  font-size:14px;
  color:var(--muted);
}

.target-row b{
  color:var(--ink);
}

.gauge{
  position:relative;
  height:10px;
  background:var(--line);
  border-radius:5px;
  overflow:hidden;
  margin:16px 0 6px;
}

.band{
  position:absolute;
  top:0;
  bottom:0;
  background:#D9E7DF;
}

.now{
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:0;
  background:var(--ink);
}

.gauge.over .now{
  background:var(--signal);
}

.gauge-lab{
  display:flex;
  justify-content:space-between;
  font-size:11px;
  color:var(--muted);
}

.mic-row{
  display:flex;
  align-items:center;
  gap:12px;
  margin-top:24px;
}

.dot{
  width:12px;
  height:12px;
  border-radius:50%;
  background:var(--line);
}

.dot.live{
  background:var(--signal);
  animation:pulse 1s infinite;
}

@keyframes pulse{
  0%,100%{opacity:1;}
  50%{opacity:.3;}
}

.mic-status{
  font-size:14px;
  color:var(--muted);
}

.meter{
  margin-top:14px;
  height:8px;
  background:var(--line);
  border-radius:5px;
  overflow:hidden;
}

.meter-fill{
  width:0;
  height:100%;
  background:var(--ink);
}

.timer{
  margin-top:24px;
  font-size:80px;
  font-weight:800;
  line-height:1;
  font-variant-numeric:tabular-nums;
}

.timer small{
  font-size:24px;
  color:var(--muted);
}

.hint{
  margin-top:8px;
  min-height:20px;
  font-size:14px;
  color:var(--muted);
}

.controls{
  display:flex;
  gap:12px;
  margin-top:26px;
}

button{
  border:none;
  border-radius:6px;
  padding:17px 20px;
  font-family:inherit;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

button:disabled{
  opacity:.4;
  cursor:not-allowed;
}

.btn-main{
  flex:1;
  background:var(--ink);
  color:white;
}

.btn-next{
  background:white;
  color:var(--ink);
  border:1px solid var(--line);
}

.result{
  display:none;
  margin-top:26px;
  padding:20px;
  background:white;
  border:1px solid var(--line);
  border-radius:10px;
}

.result.show{
  display:block;
}

.result h3{
  margin-bottom:14px;
  font-size:12px;
  color:var(--muted);
}

table{
  width:100%;
  border-collapse:collapse;
}

th,
td{
  padding:9px 6px;
  border-bottom:1px solid var(--line);
  font-size:13px;
  text-align:right;
}

th:first-child,
td:first-child{
  text-align:left;
}

tr.latest td{
  font-weight:800;
}

.verdict{
  margin-top:16px;
  font-size:14px;
  line-height:1.6;
}

.warn{
  color:var(--signal);
}

.landed{
  color:var(--ok);
  font-weight:700;
}

.flag{
  display:inline-block;
  margin-left:5px;
  padding:2px 6px;
  font-size:11px;
  border-radius:3px;
  background:#F3E6E1;
  color:var(--signal);
}

.flag.ok{
  background:#E4EFE9;
  color:var(--ok);
}

/* 한줄평 */
#feedbackBox{
  display:none;
  margin-top:30px;
  padding:22px;
  background:white;
  border:1px solid var(--line);
  border-radius:10px;
}

#feedbackBox h3{
  margin-bottom:8px;
  font-size:20px;
}

.feedback-desc{
  margin-bottom:14px;
  font-size:13px;
  line-height:1.6;
  color:var(--muted);
}

#feedbackInput{
  width:100%;
  height:90px;
  padding:12px;
  resize:vertical;
  font-family:inherit;
  font-size:14px;
  border:1px solid var(--line);
  border-radius:6px;
}

.feedback-buttons{
  display:flex;
  gap:10px;
  margin-top:12px;
}

.feedback-buttons button{
  flex:1;
}

#feedbackDone{
  display:none;
  color:var(--ok);
  font-weight:700;
}

footer{
  padding-top:26px;
  text-align:center;
  font-size:11px;
  color:var(--muted);
}
</style>
</head>

<body>

<div class="wrap">

<header>
  <span class="logo">말해봐</span>
  <span class="badge">3차 MVP</span>
  <span class="tag">목표시간 · 안착 판정</span>
</header>

<div class="qlabel">예상 질문</div>

<div class="question" id="question">
  자기소개 부탁드립니다.
</div>

<div class="qcount" id="qcount">
  질문 1 / 20
</div>

<div class="target-row">
  목표 <b id="targetTxt">60초</b> · 허용 ±10초
</div>

<div class="gauge" id="gauge">
  <div class="band" id="band"></div>
  <div class="now" id="now"></div>
</div>

<div class="gauge-lab">
  <span>0초</span>
  <span id="gaugeMax">120초</span>
</div>

<div class="mic-row">
  <span class="dot" id="dot"></span>
  <span class="mic-status" id="micStatus">마이크 준비 안 됨</span>
</div>

<div class="meter">
  <div class="meter-fill" id="meter"></div>
</div>

<div class="timer" id="timer">
  0<small>.0초</small>
</div>

<div class="hint" id="hint">
  준비되면 답변 시작을 누르세요.
</div>

<div class="controls">

  <button class="btn-main" id="mainBtn">
    답변 시작
  </button>

  <button class="btn-next" id="nextBtn">
    다음 질문
  </button>

</div>

<div class="result" id="result">

  <h3>회차별 기록</h3>

  <table>

    <thead>
      <tr>
        <th>회차</th>
        <th>시간</th>
        <th>목표</th>
        <th>어절</th>
        <th>속도</th>
      </tr>
    </thead>

    <tbody id="tbody"></tbody>

  </table>

  <div class="verdict" id="verdict"></div>

</div>


<!-- 마지막 질문 완료 후 표시 -->
<div id="feedbackBox">

  <h3>한줄평</h3>

  <div class="feedback-desc">
    테스트가 끝났습니다 👏<br>
    사용해 본 느낌을 한줄로 남겨주세요.<br>
    한줄평은 선택사항입니다.
  </div>

  <textarea
    id="feedbackInput"
    maxlength="200"
    placeholder="예: 목표시간이 있어서 답변 길이를 조절하기 쉬웠어요."
  ></textarea>

  <div class="feedback-buttons">

    <button
      class="btn-main"
      id="feedbackSubmitBtn"
      onclick="submitFeedback()"
    >
      한줄평 제출
    </button>

    <button
      class="btn-next"
      id="feedbackSkipBtn"
      onclick="skipFeedback()"
    >
      건너뛰기
    </button>

  </div>

  <div id="feedbackDone">
    감사합니다! 테스트가 완료되었습니다.
  </div>

</div>


<footer>
  마이크 음성은 기기에서 처리되며 원본 음성은 저장하지 않습니다.
</footer>

</div>


<script>

/* ===============================
   질문
================================ */

const QUESTIONS = [

  {
    q:"자기소개 부탁드립니다.",
    target:60,
    type:"자기소개"
  },

  {
    q:"우리 회사에 지원한 이유는 무엇인가요?",
    target:60,
    type:"지원동기"
  },

  {
    q:"본인의 가장 큰 강점은 무엇이라고 생각하나요?",
    target:60,
    type:"강점·성향"
  },

  {
    q:"가장 힘들었던 경험과 그것을 어떻게 극복했는지 말해주세요.",
    target:90,
    type:"경험질문"
  },

  {
    q:"협업 중 갈등이 생겼을 때 어떻게 해결했나요?",
    target:90,
    type:"경험질문"
  },

  {
    q:"5년 후 본인의 모습을 어떻게 그리고 있나요?",
    target:60,
    type:"지원동기"
  },

  {
    q:"실패했던 경험과 그로부터 배운 점을 말해주세요.",
    target:90,
    type:"경험질문"
  },

  {
    q:"본인의 단점은 무엇이며 어떻게 보완하고 있나요?",
    target:60,
    type:"강점·성향"
  },

  {
    q:"이 직무에 필요한 역량이 무엇이라고 생각하나요?",
    target:60,
    type:"지원동기"
  },

  {
    q:"본인이 주도적으로 무언가를 이끌었던 경험을 말해주세요.",
    target:90,
    type:"경험질문"
  },

  {
    q:"새로운 것을 배워야 했던 상황에서 어떻게 접근했나요?",
    target:90,
    type:"경험질문"
  },

  {
    q:"다른 지원자와 차별화되는 점은 무엇인가요?",
    target:60,
    type:"강점·성향"
  },

  {
    q:"학교에서 진행한 프로젝트 중 가장 기억에 남는 것은?",
    target:90,
    type:"경험질문"
  },

  {
    q:"예상과 다른 결과가 나왔을 때 어떻게 대응하나요?",
    target:90,
    type:"경험질문"
  },

  {
    q:"본인이 생각하는 좋은 팀워크란 무엇인가요?",
    target:60,
    type:"강점·성향"
  },

  {
    q:"입사 후 가장 먼저 하고 싶은 일은 무엇인가요?",
    target:60,
    type:"지원동기"
  },

  {
    q:"스트레스를 받을 때 어떻게 관리하나요?",
    target:60,
    type:"강점·성향"
  },

  {
    q:"우리 회사에 대해 알고 있는 것을 말해주세요.",
    target:60,
    type:"지원동기"
  },

  {
    q:"본인을 한 문장으로 표현한다면?",
    target:30,
    type:"단답"
  },

  {
    q:"마지막으로 하고 싶은 말이 있나요?",
    target:30,
    type:"단답"
  }

];


/* ===============================
   변수
================================ */

let qIndex = 0;

let records = {};

let audioCtx = null;
let analyser = null;
let micStream = null;
let dataArr = null;

let state = "idle";

let startTime = 0;
let lastVoice = 0;
let raf = null;

let recognition = null;
let transcript = "";

let feedbackNoticeShown = false;

const SILENCE_MS = 2000;
const VOICE_THRESHOLD = 0.04;
const TOL = 10;


/* ===============================
   요소
================================ */

const questionEl = document.getElementById("question");
const qcountEl = document.getElementById("qcount");

const targetTxtEl = document.getElementById("targetTxt");

const gaugeEl = document.getElementById("gauge");
const bandEl = document.getElementById("band");
const nowEl = document.getElementById("now");
const gaugeMaxEl = document.getElementById("gaugeMax");

const dot = document.getElementById("dot");
const micStatus = document.getElementById("micStatus");
const meter = document.getElementById("meter");

const timerEl = document.getElementById("timer");
const hintEl = document.getElementById("hint");

const mainBtn = document.getElementById("mainBtn");
const nextBtn = document.getElementById("nextBtn");

const resultEl = document.getElementById("result");
const tbody = document.getElementById("tbody");
const verdictEl = document.getElementById("verdict");


function cur(){
  return QUESTIONS[qIndex];
}


function getGaugeMax(){
  return cur().target * 2;
}


/* ===============================
   질문 화면
================================ */

function renderQuestion(){

  const c = cur();

  questionEl.textContent = c.q;

  qcountEl.textContent =
    `질문 ${qIndex + 1} / ${QUESTIONS.length}`;

  targetTxtEl.textContent =
    `${c.target}초`;

  const max = getGaugeMax();

  gaugeMaxEl.textContent =
    `${max}초`;

  bandEl.style.left =
    ((c.target - TOL) / max * 100) + "%";

  bandEl.style.width =
    ((TOL * 2) / max * 100) + "%";

  nowEl.style.width = "0%";

  gaugeEl.classList.remove("over");

  if(qIndex === QUESTIONS.length - 1){
    nextBtn.textContent = "테스트 완료";
  }else{
    nextBtn.textContent = "다음 질문";
  }

}


function updateGauge(sec){

  const max = getGaugeMax();

  nowEl.style.width =
    Math.min(100, sec / max * 100) + "%";

  gaugeEl.classList.toggle(
    "over",
    sec > cur().target + TOL
  );

}


function fmt(sec){

  const whole = Math.floor(sec);
  const decimal = Math.floor((sec % 1) * 10);

  return `${whole}<small>.${decimal}초</small>`;

}


/* ===============================
   마이크
================================ */

async function initMic(){

  try{

    micStream =
      await navigator.mediaDevices.getUserMedia({
        audio:true
      });

    audioCtx =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    const source =
      audioCtx.createMediaStreamSource(micStream);

    analyser =
      audioCtx.createAnalyser();

    analyser.fftSize = 512;

    source.connect(analyser);

    dataArr =
      new Uint8Array(
        analyser.frequencyBinCount
      );

    micStatus.textContent =
      "마이크 준비 완료";


    const SR =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;


    if(SR){

      recognition = new SR();

      recognition.lang = "ko-KR";
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onresult = e => {

        let text = "";

        for(let i=0; i<e.results.length; i++){
          text += e.results[i][0].transcript + " ";
        }

        transcript = text.trim();

      };

    }

    return true;

  }catch(error){

    console.error(error);

    micStatus.textContent =
      "마이크 권한이 필요합니다";

    return false;

  }

}


function rms(){

  analyser.getByteTimeDomainData(dataArr);

  let sum = 0;

  for(let i=0; i<dataArr.length; i++){

    const v =
      (dataArr[i] - 128) / 128;

    sum += v * v;

  }

  return Math.sqrt(
    sum / dataArr.length
  );

}


/* ===============================
   음성 감지
================================ */

function loop(){

  const level = rms();

  meter.style.width =
    Math.min(100, level * 400) + "%";

  const now =
    performance.now();


  if(
    state === "listening" &&
    level > VOICE_THRESHOLD
  ){

    state = "speaking";

    startTime = now;
    lastVoice = now;

    dot.className = "dot live";

    micStatus.textContent =
      "답변 감지 중…";

    hintEl.textContent =
      "말을 멈추면 자동으로 종료됩니다.";


    if(recognition){

      transcript = "";

      try{
        recognition.start();
      }catch(e){}

    }

  }


  if(state === "speaking"){

    if(level > VOICE_THRESHOLD){
      lastVoice = now;
    }

    const elapsed =
      (now - startTime) / 1000;

    timerEl.innerHTML =
      fmt(elapsed);

    updateGauge(elapsed);


    if(
      now - lastVoice >
      SILENCE_MS
    ){

      const finalSec =
        Math.max(
          0,
          elapsed - SILENCE_MS / 1000
        );

      finish(finalSec);

      return;

    }

  }


  raf =
    requestAnimationFrame(loop);

}


/* ===============================
   답변 시작
================================ */

mainBtn.addEventListener(
  "click",
  async () => {

    if(
      state !== "idle" &&
      state !== "done"
    ){
      return;
    }


    if(!audioCtx){

      const ok =
        await initMic();

      if(!ok){
        return;
      }

    }


    if(audioCtx.state === "suspended"){
      await audioCtx.resume();
    }


    state = "listening";

    transcript = "";

    timerEl.innerHTML =
      "0<small>.0초</small>";

    dot.className =
      "dot live";

    micStatus.textContent =
      "말씀을 시작하면 측정이 시작됩니다";

    hintEl.textContent =
      "지금부터 소리 내어 답해 보세요.";

    mainBtn.textContent =
      "측정 중…";

    mainBtn.disabled = true;
    nextBtn.disabled = true;

    loop();

  }
);


/* ===============================
   답변 종료
================================ */

function finish(seconds){

  cancelAnimationFrame(raf);

  if(recognition){

    try{
      recognition.stop();
    }catch(e){}

  }

  state = "done";

  dot.className = "dot";

  micStatus.textContent =
    "측정 완료";

  meter.style.width = "0%";

  mainBtn.textContent =
    "다시 답하기";

  mainBtn.disabled = false;
  nextBtn.disabled = false;

  hintEl.textContent =
    "방금 답변을 확인하고 다시 답해 보세요.";

  timerEl.innerHTML =
    fmt(seconds);

  updateGauge(seconds);


  let words = null;

  if(transcript){

    words =
      transcript
        .split(/\s+/)
        .filter(Boolean)
        .length;

  }


  saveRecord(
    seconds,
    words
  );


  /* 첫 번째 질문 종료 후 딱 한 번 안내 */

  if(
    qIndex === 0 &&
    !feedbackNoticeShown
  ){

    feedbackNoticeShown = true;

    alert(
      "한줄평은 마지막 질문을 넘기면 입력할 수 있습니다."
    );

  }

}


/* ===============================
   다음 질문
================================ */

nextBtn.addEventListener(
  "click",
  () => {

    if(
      qIndex ===
      QUESTIONS.length - 1
    ){

      showFeedback();

      return;

    }


    qIndex++;

    renderQuestion();

    state = "idle";

    timerEl.innerHTML =
      "0<small>.0초</small>";

    mainBtn.textContent =
      "답변 시작";

    micStatus.textContent =
      audioCtx
      ? "마이크 준비 완료"
      : "마이크 준비 안 됨";

    hintEl.textContent =
      "준비되면 답변 시작을 누르세요.";

    renderTable();

  }
);


/* ===============================
   기록
================================ */

function saveRecord(sec, words){

  if(!records[qIndex]){
    records[qIndex] = [];
  }

  const target =
    cur().target;

  const wpm =
    words !== null && sec > 0
    ? Math.round(
        words / (sec / 60)
      )
    : null;


  records[qIndex].push({

    sec:sec,

    words:words,

    wpm:wpm,

    target:target,

    diff:sec - target,

    landed:
      Math.abs(sec - target) <= TOL

  });


  renderTable();

}


/* ===============================
   결과표
================================ */

function renderTable(){

  const list =
    records[qIndex] || [];


  if(list.length === 0){

    resultEl.classList.remove("show");

    return;

  }


  resultEl.classList.add("show");

  tbody.innerHTML = "";


  list.forEach((r,i) => {

    const tr =
      document.createElement("tr");


    if(i === list.length - 1){
      tr.className = "latest";
    }


    const wordText =
      r.words === null
      ? "—"
      : `${r.words}`;


    const speedText =
      r.wpm === null
      ? "—"
      : r.wpm;


    let targetText;


    if(r.landed){

      targetText =
        `<span class="landed">안착</span>`;

    }else{

      const sign =
        r.diff > 0 ? "+" : "";

      targetText =
        `${sign}${r.diff.toFixed(0)}초`;

    }


    tr.innerHTML = `
      <td>${i + 1}회차</td>
      <td>${r.sec.toFixed(0)}초</td>
      <td>${targetText}</td>
      <td>${wordText}</td>
      <td>${speedText}</td>
    `;


    tbody.appendChild(tr);

  });


  const last =
    list[list.length - 1];


  let head = "";


  if(last.landed){

    head =
      `목표 ${last.target}초에
      <span class="landed">안착했습니다.</span>`;

  }else if(last.diff > 0){

    head =
      `목표 ${last.target}초보다
      <span class="warn">
      ${last.diff.toFixed(0)}초 깁니다.
      </span>`;

  }else{

    head =
      `목표 ${last.target}초보다
      <span class="warn">
      ${Math.abs(last.diff).toFixed(0)}초 짧습니다.
      </span>`;

  }


  let body = "";


  if(list.length >= 2){

    const first =
      list[0];

    const timeDrop =
      first.sec - last.sec;

    const percent =
      timeDrop / first.sec * 100;


    if(
      first.words !== null &&
      last.words !== null &&
      timeDrop > 0.5
    ){

      const speedUp =
        last.wpm - first.wpm;

      const wordDrop =
        first.words - last.words;


      if(
        speedUp > 25 &&
        wordDrop < first.words * 0.1
      ){

        body =
          `<br>
          시간은 ${timeDrop.toFixed(0)}초
          (${percent.toFixed(0)}%) 줄었지만
          말 속도가 크게 빨라졌습니다.
          <span class="flag">속도만 빨라짐</span>`;

      }else{

        body =
          `<br>
          시간은 ${timeDrop.toFixed(0)}초
          (${percent.toFixed(0)}%) 줄었습니다.
          <span class="flag ok">내용 압축</span>`;

      }

    }

  }else{

    body =
      "<br>한 번 더 답해 목표에 가까워지는지 확인해 보세요.";

  }


  verdictEl.innerHTML =
    head + body;

}


/* 첫 화면 */

renderQuestion();

</script>

/* ===============================
   참가자 ID
================================ */

let participantId =
  sessionStorage.getItem(
    "participant_id"
  );


if(!participantId){

  participantId =
    prompt(
      "참여자 번호를 입력해주세요.\n예: P1"
    );


  if(!participantId){
    participantId = "TEST";
  }


  participantId =
    participantId
      .trim()
      .toUpperCase();


  sessionStorage.setItem(
    "participant_id",
    participantId
  );

}


/* ===============================
   답변 기록을 Supabase에도 저장
================================ */

const originalSaveRecord =
  saveRecord;


saveRecord =
  function(sec, words){

    originalSaveRecord(
      sec,
      words
    );


    const currentQuestion =
      cur();


    const attemptNo =
      records[qIndex].length;


    const logData = {

      participant_id:
        participantId,

      mvp_version:
        3,

      question_id:
        `Q${qIndex + 1}`,

      question_type:
        currentQuestion.type,

      attempt_no:
        attemptNo,

      duration_sec:
        Number(
          sec.toFixed(2)
        ),

      target_sec:
        currentQuestion.target,

      word_count:
        words

    };


    supabaseClient
      .from("answer_logs")
      .insert(logData)
      .then(({error}) => {

        if(error){

          console.error(
            "Supabase 저장 실패:",
            error
          );

        }else{

          console.log(
            "Supabase 저장 성공:",
            logData
          );

        }

      });

  };


/* ===============================
   마지막 질문 완료
================================ */

function showFeedback(){

  document.getElementById(
    "feedbackBox"
  ).style.display =
    "block";


  mainBtn.disabled = true;
  nextBtn.disabled = true;


  document.getElementById(
    "feedbackBox"
  ).scrollIntoView({
    behavior:"smooth",
    block:"center"
  });

}


/* ===============================
   한줄평 제출
================================ */

async function submitFeedback(){

  const input =
    document.getElementById(
      "feedbackInput"
    );


  const feedback =
    input.value.trim();


  if(!feedback){

    alert(
      "한줄평을 입력하거나 건너뛰기를 눌러주세요."
    );

    return;

  }


  const { error } =
    await supabaseClient
      .from("feedback_logs")
      .insert({

        participant_id:
          participantId,

        mvp_version:
          3,

        feedback:
          feedback

      });


  if(error){

    console.error(
      "한줄평 저장 실패:",
      error
    );

    alert(
      "저장에 실패했습니다."
    );

    return;

  }


  finishFeedback();

}


/* ===============================
   건너뛰기
================================ */

function skipFeedback(){

  finishFeedback();

}


/* ===============================
   테스트 완료
================================ */

function finishFeedback(){

  document.querySelector(
    ".feedback-desc"
  ).style.display =
    "none";


  document.getElementById(
    "feedbackInput"
  ).style.display =
    "none";


  document.querySelector(
    ".feedback-buttons"
  ).style.display =
    "none";


  document.getElementById(
    "feedbackDone"
  ).style.display =
    "block";

}

</script>
